# Rigenera le pagine del sito ogni volta che modifichi i testi o i dati.
# Non serve toccarlo: parte da solo dopo ogni modifica su GitHub.
name: Rigenera il sito
on:
  push:
    branches: [main]
    paths:
      - "sorgente/**"
      - "assets/config.js"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installa e genera
        working-directory: sorgente
        run: |
          npm ci || npm install
          npm run build
      - name: Salva le pagine generate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Pagine rigenerate in automatico"
          git push
